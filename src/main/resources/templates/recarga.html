<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recargar Saldo - Steem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="body-login">

<a th:href="@{/}" class="logo-floating"
   style="position: absolute; top: 30px; left: 40px; z-index: 1000; transition: transform 0.3s;">
    <img th:src="@{/images/steem-logo.png}" alt="Steem Logo"
         style="height: 60px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));">
</a>

<div class="login-container">
    <div class="card-login-steem" style="max-width: 800px; padding: 0;">

        <div class="row g-0">
            <div class="col-md-5 p-4 border-end border-secondary" style="background: rgba(0,0,0,0.2);">
                <h4 class="text-white mb-4 fw-bold"><i class="fas fa-coins text-warning me-2"></i> Importe</h4>

                <div class="d-grid gap-3">
                    <label class="amount-option">
                        <input type="radio" name="cantidadSeleccionada" value="5" checked onchange="toggleCustomAmount()">
                        <div class="option-content">
                            <span class="fw-bold">5.00 €</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="cantidadSeleccionada" value="10" onchange="toggleCustomAmount()">
                        <div class="option-content">
                            <span class="fw-bold">10.00 €</span>
                            <span class="badge bg-success ms-2">Popular</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="cantidadSeleccionada" value="20" onchange="toggleCustomAmount()">
                        <div class="option-content">
                            <span class="fw-bold">20.00 €</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="cantidadSeleccionada" value="50" onchange="toggleCustomAmount()">
                        <div class="option-content">
                            <span class="fw-bold">50.00 €</span>
                        </div>
                    </label>

                    <label class="amount-option">
                        <input type="radio" name="cantidadSeleccionada" value="custom" id="radioCustom" onchange="toggleCustomAmount()">
                        <div class="option-content d-flex align-items-center">
                            <span class="fw-bold me-2">Otro:</span>
                            <input type="number" id="customAmountInput" class="form-control bg-dark text-white border-secondary p-1"
                                   style="width: 100px; text-align: right; height: 30px;"
                                   placeholder="0.00" step="0.01" min="1" disabled>
                            <span class="ms-2 fw-bold">€</span>
                        </div>
                    </label>
                </div>

                <div class="mt-4 text-center">
                    <small class="text-secondary">El saldo se añadirá a tu cartera inmediatamente.</small>
                </div>
            </div>

            <div class="col-md-7 p-4">
                <h4 class="text-white mb-4 fw-bold"><i class="far fa-credit-card text-info me-2"></i> Pago Seguro</h4>

                <form id="paymentForm" method="post" th:action="@{/cliente/cargarSaldo}">

                    <div class="mb-3">
                        <label class="text-secondary small mb-1">TITULAR DE LA TARJETA</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="cardName" placeholder="Como aparece en la tarjeta" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="text-secondary small mb-1">NÚMERO DE TARJETA</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-credit-card"></i></span>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                            <span class="input-group-text bg-dark border-secondary text-success" id="cardIcon" style="display:none;"><i class="fas fa-check"></i></span>
                        </div>
                        <div id="cardError" class="text-danger small mt-1" style="display:none;">Número inválido</div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="text-secondary small mb-1">CADUCIDAD</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary text-center" id="cardExpiry" placeholder="MM / YY" maxlength="7" required>
                            <div id="expiryError" class="text-danger small mt-1" style="display:none;">Expirada</div>
                        </div>

                        <div class="col-6 mb-3">
                            <label class="text-secondary small mb-1">CVV / CVC</label>
                            <div class="input-group">
                                <input type="password" class="form-control bg-dark text-white border-secondary text-center" id="cardCvv" placeholder="123" maxlength="3" required>
                                <span class="input-group-text bg-dark border-secondary text-secondary" title="3 dígitos traseros"><i class="fas fa-question-circle"></i></span>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" name="cantidad" id="inputCantidadFinal">

                    <hr class="border-secondary my-4">

                    <button type="submit" class="btn-action" id="btnPay">
                        <i class="fas fa-lock me-2"></i> PAGAR Y RECARGAR
                    </button>

                    <div class="text-center mt-3">
                        <i class="fab fa-cc-visa fa-2x text-secondary mx-1"></i>
                        <i class="fab fa-cc-mastercard fa-2x text-secondary mx-1"></i>
                        <i class="fab fa-cc-amex fa-2x text-secondary mx-1"></i>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Función para habilitar/deshabilitar el input personalizado
    // Debe estar fuera del DOMContentLoaded para que el HTML la encuentre
    function toggleCustomAmount() {
        const radioCustom = document.getElementById('radioCustom');
        const customInput = document.getElementById('customAmountInput');

        if (radioCustom.checked) {
            customInput.disabled = false;
            customInput.focus();
        } else {
            customInput.disabled = true;
            customInput.value = '';
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById('paymentForm');
        const cardNumber = document.getElementById('cardNumber');
        const cardExpiry = document.getElementById('cardExpiry');
        const cardCvv = document.getElementById('cardCvv');
        const radios = document.getElementsByName('cantidadSeleccionada');
        const customInput = document.getElementById('customAmountInput');

        // Referencia al input oculto de seguridad
        const hiddenInput = document.getElementById('inputCantidadFinal');

        // 1. Formato visual: Número de tarjeta (Espacios cada 4)
        cardNumber.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            let formattedValue = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formattedValue += ' ';
                formattedValue += value[i];
            }
            e.target.value = formattedValue;

            // Icono de check visual
            if(value.length === 16) {
                document.getElementById('cardIcon').style.display = 'block';
                document.getElementById('cardError').style.display = 'none';
            } else {
                document.getElementById('cardIcon').style.display = 'none';
            }
        });

        // 2. Formato visual: Fecha (Añade barra /)
        cardExpiry.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 4) value = value.substring(0, 4); // Limite MMYY

            if (value.length >= 2) {
                e.target.value = value.substring(0, 2) + ' / ' + value.substring(2);
            } else {
                e.target.value = value;
            }
        });

        // 3. Formato visual: Solo números en CVV
        cardCvv.addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // 4. LÓGICA DE ENVÍO SEGURO
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Detenemos el envío para validar y preparar datos

            // --- VALIDACIONES DE TARJETA ---
            const rawCardNum = cardNumber.value.replace(/\s/g, '');
            if (rawCardNum.length !== 16) {
                document.getElementById('cardError').style.display = 'block';
                document.getElementById('cardError').innerText = "El número debe tener 16 dígitos.";
                return;
            }

            const expiryParts = cardExpiry.value.split(' / ');
            if (expiryParts.length === 2 && expiryParts[1].length === 2) {
                const mes = parseInt(expiryParts[0]);
                const anio = parseInt("20" + expiryParts[1]);
                const fechaActual = new Date();

                // Validación simple de fecha futura
                if (mes < 1 || mes > 12 || anio < fechaActual.getFullYear() ||
                    (anio === fechaActual.getFullYear() && mes < (fechaActual.getMonth() + 1))) {
                    document.getElementById('expiryError').style.display = 'block';
                    return;
                } else {
                    document.getElementById('expiryError').style.display = 'none';
                }
            } else {
                document.getElementById('expiryError').style.display = 'block';
                return;
            }

            // --- OBTENCIÓN DE LA CANTIDAD ---
            let cantidad = 0;
            let esCustom = false;

            for (const radio of radios) {
                if (radio.checked) {
                    if (radio.value === 'custom') {
                        cantidad = customInput.value;
                    } else {
                        cantidad = radio.value;
                    }
                    break;
                }
            }

            // Validar que la cantidad sea un número positivo
            if (!cantidad || parseFloat(cantidad) <= 0) {
                alert("Por favor, introduce una cantidad válida mayor a 0.");
                return;
            }

            // --- PASO CLAVE DE SEGURIDAD ---
            // Asignamos el valor al input oculto en lugar de a la URL
            hiddenInput.value = cantidad;

            // Efecto visual de carga
            const btn = document.getElementById('btnPay');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> PROCESANDO...';
            btn.disabled = true;

            setTimeout(() => {
                // Enviamos el formulario.
                // IMPORTANTE: NO modificamos form.action.
                // Se usará el th:action="@{/cliente/cargarSaldo}" del HTML.
                form.submit();
            }, 1500);
        });
    });
</script>

</body>
</html>
