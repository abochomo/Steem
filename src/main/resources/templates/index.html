<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <title>Steem - Tienda</title>
</head>
<body>

<div th:replace="~{fragments/nav :: barra_navegacion}"></div>

<div class="container mt-4">

    <!-- SECCIÓN DE BUSCADOR (NUEVO) -->
    <div class="row mb-4">
        <div class="col-md-6 mx-auto">
            <form th:action="@{/}" method="get">
                <div class="input-group">
                    <!-- th:value="${keyword}" sirve para que el texto no se borre al buscar -->
                    <input type="text" name="keyword" class="form-control" placeholder="Buscar por nombre..." th:value="${keyword}">
                    <button class="btn btn-steam" type="submit">Buscar</button>
                    <!-- Botón para limpiar filtro si hay búsqueda -->
                    <a th:if="${keyword != null && keyword != ''}" th:href="@{/}" class="btn btn-secondary">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <h2 class="mb-4">Juegos Destacados</h2>

    <!-- Mensaje si no se encuentran juegos -->
    <div th:if="${listaJuegos.isEmpty()}" class="alert alert-info text-center">
        No se encontraron juegos con ese nombre.
    </div>

    <div class="row">
        <div class="col-md-3 mb-4" th:each="juego : ${listaJuegos}">

            <div class="card h-100">
                <img th:src="@{/images/placeholder.jpg}" class="card-img-top" alt="Portada">

                <div class="card-body">
                    <h5 class="card-title" th:text="${juego.titulo}">Nombre Juego</h5>

                    <p class="card-text text-muted" th:text="${juego.descripcion}">Descripción corta...</p>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-secondary" th:text="${juego.precio} + ' €'">59.99 €</span>

                        <a th:href="@{/comprar/{id}(id=${juego.idJuego})}" class="btn btn-steam btn-sm">Comprar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
