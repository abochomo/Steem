<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Steem - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/nav :: barra_navegacion}"></div>

<div class="container login-container">

    <div class="card card-login p-4">
        <h3>INICIAR SESIÓN</h3>

        <form th:action="@{/login}" method="post">

            <div th:if="${param.error}" class="alert alert-danger text-center p-2">
                Usuario o contraseña incorrectos
            </div>

            <div th:if="${param.logout}" class="alert alert-success text-center p-2">
                Has cerrado sesión correctamente
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="text" class="form-control" id="email" name="email" placeholder="Tu correo electrónico" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-steam py-2">Ingresar</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="#" class="text-decoration-none text-muted small">¿Olvidaste tu contraseña?</a>
            <br>
            <span class="text-muted small">¿No tienes cuenta?</span>
            <a th:href="@{/registro}">Únete a Steem</a>
            <br>
            <span class="text-muted small">¿Quieres publicar tus juegos?</span>
            <a th:href="@{/registro/desarrollador}">Regístrate como desarrollador</a>
        </div>
    </div>
</div>

</body>
</html>
