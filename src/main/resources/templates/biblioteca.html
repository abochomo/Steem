<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Steem - Mi Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="body-login">

<header>
    <div class="logo-container">
        <a th:href="@{/}">
            <img th:src="@{/images/steem-logo.png}" alt="Steem Logo" class="logo-img">
        </a>
    </div>

    <nav class="nav-links">
        <a th:href="@{/}" class="btn-nav">Tienda</a>
        <a th:href="@{/biblioteca}" class="btn-nav" style="background-color: white; color: black;">Biblioteca</a>
    </nav>

    <div class="nav-links profile-container">
        <a th:href="@{/usuario/perfil}" class="btn-profile" title="Mi Perfil">
            <i class="fas fa-user-check"></i>
        </a>
    </div>
</header>

<div class="container mt-4 mb-5" style="max-width: 900px;">

    <h2 class="section-title"> <i class="fas fa-gamepad"></i> Mi Biblioteca</h2>

    <div th:if="${biblioteca == null or biblioteca.isEmpty()}" class="steem-card text-center mt-4">
        <i class="fas fa-ghost fa-3x mb-3" style="color: #666;"></i>
        <h4>Tu biblioteca está vacía</h4>
        <p class="text-secondary">¡Explora la tienda para añadir tu primer juego!</p>
        <a th:href="@{/}" class="btn-action mt-3">Ir a la Tienda</a>
    </div>

    <div class="mt-4">

        <div class="library-item" th:each="item : ${biblioteca}">

            <div class="lib-img-container">
                <img th:if="${item.juego.imagenUrl != null && !item.juego.imagenUrl.isEmpty()}"
                     th:src="@{${item.juego.imagenUrl}}" alt="Portada" class="game-image">

                <img th:if="${item.juego.imagenUrl == null || item.juego.imagenUrl.isEmpty()}"
                     th:src="@{/images/placeholder.jpg}" alt="Portada" class="game-image">
            </div>

            <div class="lib-content">
                <div class="d-flex justify-content-between align-items-start">
                    <h3 class="text-white fw-bold mb-1" th:text="${item.juego.titulo}">Título Juego</h3>
                    <small class="text-secondary" th:text="${item.fechaAdquisicion}">01/01/2024</small>
                </div>

                <p class="text-success mb-3" style="font-size: 0.9rem;">
                    <i class="fas fa-code"></i> Dev:
                    <span th:text="${item.juego.desarrollador.nombreUsuario}" class="text-white">Desarrollador</span>
                </p>

                <div class="lib-actions">
                    <a href="#" class="btn-play">
                        <i class="fas fa-play"></i> JUGAR
                    </a>
                    <a th:href="@{/resenha/nueva/{id}(id=${item.juego.id})}" class="btn-outline-steem">
                        <i class="fas fa-star"></i> Reseña
                    </a>
                    <a th:href="@{/reembolsar/{id}(id=${item.juego.id})}"
                       class="btn-danger-steem"
                       title="Solicitar Reembolso">
                        <i class="fas fa-undo"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
