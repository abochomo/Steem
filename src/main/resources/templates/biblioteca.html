<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Steem - Mi Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/nav :: barra_navegacion}"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-white"> <i class="bi bi-collection-play"></i> Mi Biblioteca</h2>

    <!-- Mensaje si está vacía -->
    <div th:if="${biblioteca != null and !biblioteca.isEmpty()}" class="alert alert-secondary text-center">
        <h4>Tu biblioteca está vacía</h4>
        <p>¡Explora la tienda para añadir tu primer juego!</p>
        <a href="/" class="btn btn-steam">Ir a la Tienda</a>
    </div>

    <!-- Lista de Juegos en propiedad -->
    <div class="row">
        <!-- Iteramos sobre objetos 'Biblioteca', no 'Juego' directamente -->
        <div class="col-md-12 mb-3" th:each="item : ${biblioteca}">

            <div class="card text-white bg-dark border-secondary">
                <div class="row g-0">
                    <div class="col-md-2">
                        <!-- Imagen pequeña tipo lista -->
                        <img th:src="@{/images/placeholder.jpg}" class="img-fluid rounded-start h-100" style="object-fit: cover;" alt="Portada">
                    </div>
                    <div class="col-md-10">
                        <div class="card-body d-flex justify-content-between align-items-center h-100">

                            <!-- Info del Juego -->
                            <div>
                                <h4 class="card-title text-info" th:text="${item.juego.titulo}">Título</h4>
                                <p class="card-text text-muted mb-1">
                                    Desarrollado por: <span th:text="${item.juego.desarrollador.nombreUsuario}">Dev</span>
                                </p>
                                <p class="card-text text-muted mb-1">
                                    Adquirido el: <span th:text="${item.fechaAdquisicion}">Dia</span>
                                </p>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex gap-2">
                                <a href="#" class="btn btn-success">
                                    <i class="bi bi-play-fill"></i> Jugar
                                </a>
                                <a href="#" class="btn btn-outline-light">
                                    Escribir Reseña
                                </a>
                                <!-- Botón Reembolsar (Peligroso -> Rojo) -->
                                <a href="#" class="btn btn-outline-danger btn-sm d-flex align-items-center">
                                    Reembolsar
                                </a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
