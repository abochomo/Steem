<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Steem - Mi Perfil</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS personalizado -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Menú de Navegación -->
<div th:replace="~{fragments/nav :: barra_navegacion}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <!-- Tarjeta de Perfil con estilo oscuro -->
            <div class="card text-white" style="background-color: #16202d; border: 1px solid #2a475e;">
                <div class="card-header border-secondary">
                    <h3 class="mb-0">Mi Perfil</h3>
                </div>

                <div class="card-body p-4">
                    <div class="row align-items-center">

                        <!-- Columna Izquierda: Foto y Rol -->
                        <div class="col-md-4 text-center border-end border-secondary">
                            <!-- Placeholder de imagen circular -->
                            <img th:src="@{/images/placeholder_avatar.jpg}"
                                 onerror="this.src='https://via.placeholder.com/150'"
                                 class="rounded-circle img-thumbnail bg-secondary border-0 mb-3"
                                 alt="Avatar" style="width: 150px; height: 150px; object-fit: cover;">

                            <div>
                                <!-- Badge que muestra si es Cliente o Admin -->
                                <span class="badge bg-primary fs-6" th:text="${usuario.tipoUsuario}">Tipo Usuario</span>
                            </div>
                        </div>

                        <!-- Columna Derecha: Datos del Usuario -->
                        <div class="col-md-8 ps-md-4 mt-3 mt-md-0">
                            <h2 class="text-info" th:text="${usuario.nombreUsuario}">NombreUsuario</h2>
                            <p class="text-muted mb-4" th:text="${usuario.email}">email@ejemplo.com</p>

                            <div class="mb-3">
                                <strong class="text-light">Fecha de Registro:</strong>
                                <!-- Formateamos la fecha para que se lea bien -->
                                <span class="ms-2 text-secondary" th:text="${#dates.format(usuario.fechaRegistro, 'dd/MM/yyyy')}">01/01/2024</span>
                            </div>

                            <hr class="border-secondary my-4">

                            <!-- Botones de Acción -->
                            <div class="d-flex gap-2">
                                <a href="#" class="btn btn-steam">
                                    <i class="bi bi-pencil"></i> Editar Datos
                                </a>
                                <!-- El botón solicitado -->
                                <a href="#" class="btn btn-outline-danger">
                                    Cambiar Contraseña
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
