<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${juego.titulo} + ' - Steem'">Detalles del Juego</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="body-login"> <header>
    <div class="logo-container">
        <a th:href="@{/}"><img th:src="@{/images/steem-logo.png}" alt="Logo" class="logo-img"></a>
    </div>
    <nav class="nav-links">
        <a th:href="@{/}" class="btn-nav">Tienda</a>
        <a th:href="@{/biblioteca}" class="btn-nav" sec:authorize="isAuthenticated()">Biblioteca</a>
    </nav>
    <div class="nav-links profile-container">
        <a sec:authorize="isAuthenticated()" th:href="@{/usuario/perfil}" class="btn-profile"><i class="fas fa-user"></i></a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn-profile"><i class="fas fa-user"></i></a>
    </div>
</header>

<div class="container-details">

    <div class="details-left">

        <img th:if="${juego.imagenUrl != null && !juego.imagenUrl.isEmpty()}"
             th:src="@{${juego.imagenUrl}}"
             class="hero-image" alt="Portada">

        <div th:if="${juego.imagenUrl == null || juego.imagenUrl.isEmpty()}" class="hero-image-placeholder">
            <i class="fas fa-gamepad fa-4x"></i>
        </div>

        <div class="actions-row">
            <button class="btn-heart">
                <i class="far fa-heart"></i>
            </button>

            <a href="#" class="btn-add-cart">
                AÑADIR AL CARRITO:<span th:text="${juego.precio} + ' €'">0.00 €</span>
            </a>
        </div>
    </div>

    <div class="details-right">

        <div class="info-box">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="box-title" th:text="${juego.titulo}">TITULO</h2>
            </div>

            <h4 style="color:white; font-size: 1rem; margin-bottom: 10px;">ACERCA DE...</h4>
            <p class="box-text" th:text="${juego.descripcion}">
                Descripción del juego...
            </p>

            <div class="mt-3 text-end">
                <small class="text-muted">Publicado: <span th:text="${#dates.format(juego.fechaPublicacion, 'dd/MM/yyyy')}">Fecha</span></small>
            </div>
        </div>

        <div class="reviews-box">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 style="color:white; font-size: 1rem; font-weight: bold; margin:0;">RESEÑAS</h4>
                <span class="badge bg-secondary"
                      th:text="${listaResenas != null ? listaResenas.size() : 0} + ' Opiniones'">0 Opiniones</span>
            </div>

            <div th:if="${listaResenas == null or listaResenas.isEmpty()}" class="text-center py-3">
                <p class="text-muted">Aún no hay reseñas para este juego.</p>
            </div>

            <div class="review-item" th:each="resenha : ${listaResenas}">

                <div class="review-avatar d-flex align-items-center justify-content-center fw-bold text-white">
                    <span th:text="${resenha.cliente != null ? #strings.substring(resenha.cliente.nombreUsuario,0,1).toUpperCase() : 'U'}">U</span>
                </div>

                <div class="review-content">
                    <div class="d-flex justify-content-between">
                        <strong th:text="${resenha.cliente != null ? resenha.cliente.nombreUsuario : 'Anónimo'}" style="color: #66c0f4;">Usuario</strong>
                        <small class="text-muted" th:text="${#dates.format(resenha.fechaPublicacion, 'dd/MM/yyyy')}">Fecha</small>
                    </div>

                    <p class="review-text mt-2" th:text="${resenha.texto}">Opinión...</p>

                    <div class="mt-2">
                        <small th:if="${resenha.recomendado == true}" style="color: #2ecc71;">
                            <i class="fas fa-thumbs-up"></i> Recomendado
                        </small>
                        <small th:if="${resenha.recomendado == false}" style="color: #e74c3c;">
                            <i class="fas fa-thumbs-down"></i> No recomendado
                        </small>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
