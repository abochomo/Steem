<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Bibliotecas - Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="body-login">

<header>
    <div class="logo-container">
        <a th:href="@{/admin/panel}" class="btn-back-admin">← Volver al Panel</a>
    </div>
    <div class="profile-container">
        <span style="color: #66c0f4;">Admin: <span th:text="${usuarioAdmin}">Admin</span></span>
    </div>
</header>

<main>
    <div class="admin-header" style="width: 100%; max-width: 1100px;">
        <h2 class="admin-title">Gestión de Bibliotecas y Reembolsos</h2>
    </div>

    <div style="width: 100%; max-width: 1100px; margin-bottom: 20px;">
        <div th:if="${mensajeError}" style="background-color: rgba(231, 76, 60, 0.2); border: 1px solid #c0392b; color: #ffcccc; padding: 15px; border-radius: 5px;">
            ⚠️ <span th:text="${mensajeError}">Error</span>
        </div>
        <div th:if="${mensajeExito}" style="background-color: rgba(46, 204, 113, 0.2); border: 1px solid #27ae60; color: #d4efdf; padding: 15px; border-radius: 5px;">
            💰 <span th:text="${mensajeExito}">Éxito</span>
        </div>
    </div>

    <div class="admin-table-container" style="width: 100%; max-width: 1100px;">
        <table class="table-admin">
            <thead>
            <tr>
                <th>ID</th>
                <th>Usuario (Cliente)</th>
                <th>Juego</th>
                <th>Precio (a reembolsar)</th>
                <th>Fecha Adquisición</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="biblio : ${bibliotecas}">
                <td th:text="${biblio.id}">1</td>

                <td>
                    <div style="font-weight: bold; color: white;" th:text="${biblio.cliente.nombreUsuario}">Usuario</div>
                    <div style="font-size: 0.8em; color: #888;" th:text="${biblio.cliente.email}">email@test.com</div>
                </td>

                <td th:text="${biblio.juego.titulo}" style="color: #66c0f4;">Elden Ring</td>

                <td th:text="${biblio.juego.precio} + ' €'" style="color: #a4d007; font-weight: bold;">59.99 €</td>

                <td th:text="${#dates.format(biblio.fechaAdquisicion, 'dd/MM/yyyy')}">01/01/2024</td>

                <td>
                    <a th:href="@{/admin/bibliotecas/eliminar/{id}(id=${biblio.id})}"
                       onclick="return confirm('ATENCIÓN: Al eliminar esta entrada se devolverá automáticamente el importe del juego al saldo del usuario.\n\n¿Confirmar reembolso y eliminación?');"
                       class="btn-steam"
                       style="background: linear-gradient(to right, #c0392b, #e74c3c); padding: 5px 10px; font-size: 0.8rem; text-decoration: none;">
                        Reembolsar y Borrar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bibliotecas)}">
                <td colspan="6" style="text-align: center; padding: 20px; color: #888;">No hay juegos comprados en el sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
