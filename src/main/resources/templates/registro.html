<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Steem - Crear Cuenta</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS personalizado -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- 1. Menú de Navegación (Fragmento) -->
<div th:replace="~{fragments/nav :: barra_navegacion}"></div>

<!-- 2. Contenedor Principal Centrado (Usa las mismas clases que Login) -->
<div class="container login-container">

    <div class="card card-login p-4">
        <h3>CREAR CUENTA</h3>

        <!-- Mensaje de error si falla el registro (opcional para el futuro) -->
        <div th:if="${error}" class="alert alert-danger text-center p-2" th:text="${error}">
            Error en el registro
        </div>

        <!-- 3. Formulario de Registro -->
        <!-- action apunta a /registro vía POST, que tu compañero implementará luego -->
        <form th:action="@{/registro/cliente}" th:object="${cliente}" method="post">

            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="nombreUsuario" name="nombreUsuario" th:field="*{nombreUsuario}" placeholder="Ej: Gamer123" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:field="*{email}" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" th:field="*{password}" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-steam py-2">Registrarse</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted small">¿Ya tienes una cuenta?</span>
            <a th:href="@{/login}" class="text-white small fw-bold">Inicia Sesión</a>
        </div>
    </div>
</div>

</body>
</html>
