<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Steem - Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/steem-logo.png}">
</head>
<body class="body-login">

<header>
    <div class="logo-container">
        <a th:href="@{/}"><img th:src="@{/images/steem-logo.png}" alt="Logo" class="logo-img"></a>
    </div>
</header>

<div class="container login-container">
    <div class="card-login-steem">

        <h3 class="login-title">Seguridad</h3>

        <div th:if="${error}" class="alert alert-danger rounded-pill text-center border-0 p-2 mb-3">
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/usuario/cambiar-password}" method="post">

            <div class="mb-3">
                <label for="passwordActual" class="label-steem">Contraseña Actual</label>
                <input type="password" class="form-control input-steem" id="passwordActual" name="passwordActual" required>
            </div>

            <div class="mb-4">
                <label for="nuevaPassword" class="label-steem">Nueva Contraseña</label>
                <input type="password" class="form-control input-steem" id="nuevaPassword" name="nuevaPassword" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger-steem"
                        style="background-color: transparent; border-color: #ff4d4d; color: #ff4d4d; width: 100%;">
                    Actualizar Contraseña
                </button>
                <a th:href="@{/usuario/perfil}" class="btn btn-outline-light rounded-pill mt-2" style="text-align: center;">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
